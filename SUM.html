<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル足し算電卓</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
        }

        /* カスタムガラスモルフィズムカード */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        /* 結果領域のアニメーション */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-pop-in {
            animation: fadeInScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 入力エラーのシェイクアニメーション */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* スピナー非表示 (Chrome, Safari, Edge, Opera) */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* スピナー非表示 (Firefox) */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

    <main class="w-full max-w-md">
        <!-- メインカード -->
        <div id="calculatorCard" class="glass-card rounded-3xl p-6 sm:p-8 transition-all duration-300">
            <!-- ヘッダー -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl mb-3 shadow-inner">
                    <i class="fa-solid font-bold text-2xl">+</i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">足し算計算機</h1>
                <p class="text-sm text-gray-500 mt-1">2つの数値を入力して計算ボタンを押してください</p>
            </div>

            <!-- フォーム領域 -->
            <form id="calcForm" onsubmit="event.preventDefault(); calculate();" class="space-y-5">
                <!-- 数値 1 -->
                <div>
                    <label for="num1" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">
                        数値 1
                    </label>
                    <div class="relative">
                        <input type="number" step="any" id="num1" placeholder="例: 12.5"
                            class="w-full px-4 py-3.5 bg-white/70 border border-gray-200 rounded-xl text-gray-800 text-lg font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all duration-200 shadow-sm">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">
                            <i class="fa-solid fa-pen"></i>
                        </span>
                    </div>
                </div>

                <!-- 演算子アイコン -->
                <div class="flex justify-center my-1 text-indigo-400 font-bold text-xl">
                    <div class="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center border border-indigo-100 shadow-xs">
                        +
                    </div>
                </div>

                <!-- 数値 2 -->
                <div>
                    <label for="num2" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">
                        数値 2
                    </label>
                    <div class="relative">
                        <input type="number" step="any" id="num2" placeholder="例: 8"
                            class="w-full px-4 py-3.5 bg-white/70 border border-gray-200 rounded-xl text-gray-800 text-lg font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all duration-200 shadow-sm">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">
                            <i class="fa-solid fa-pen"></i>
                        </span>
                    </div>
                </div>

                <!-- ボタン群 -->
                <div class="pt-2 grid grid-cols-3 gap-3">
                    <button type="button" onclick="resetForm()"
                        class="col-span-1 py-3.5 px-4 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 font-semibold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-gray-300">
                        <i class="fa-solid fa-rotate-left text-sm"></i>
                        <span>クリア</span>
                    </button>
                    
                    <button type="submit"
                        class="col-span-2 py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 active:scale-[0.98] text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                        <i class="fa-solid fa-calculator"></i>
                        <span>計算する</span>
                    </button>
                </div>
            </form>

            <!-- エラーメッセージ領域 -->
            <div id="errorMessage" class="hidden mt-5 p-3.5 bg-red-50/90 border border-red-200 text-red-600 text-sm rounded-xl flex items-center gap-2.5 animate-pop-in">
                <i class="fa-solid fa-circle-exclamation text-base flex-shrink-0"></i>
                <span id="errorText">数値を選択してください。</span>
            </div>

            <!-- 計算結果表示領域 -->
            <div id="resultContainer" class="hidden mt-6 pt-6 border-t border-gray-200/60 animate-pop-in">
                <div class="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-2xl p-5 border border-indigo-100/80 text-center relative overflow-hidden">
                    <p class="text-xs font-bold text-indigo-500 uppercase tracking-wider mb-1">計算結果</p>
                    <div class="text-3xl sm:text-4xl font-extrabold text-gray-800 break-all my-1 tracking-tight" id="resultValue">
                        0
                    </div>
                    <p class="text-xs text-gray-500 mt-2" id="expressionDetail">
                        0 + 0 = 0
                    </p>
                    
                    <!-- クリップボードにコピーボタン -->
                    <button onclick="copyResult()" title="結果をコピー"
                        class="absolute top-3 right-3 text-xs bg-white/80 hover:bg-white text-gray-600 px-2.5 py-1.5 rounded-lg border border-gray-200/80 shadow-xs transition-all active:scale-95 flex items-center gap-1">
                        <i class="fa-regular fa-copy"></i>
                        <span id="copyText">コピー</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- フッター -->
        <p class="text-center text-xs text-white/80 mt-6 font-medium">
            &copy; Simple Addition Web App
        </p>
    </main>

    <script>
        // 要素の取得
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const resultContainer = document.getElementById('resultContainer');
        const resultValue = document.getElementById('resultValue');
        const expressionDetail = document.getElementById('expressionDetail');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const calculatorCard = document.getElementById('calculatorCard');

        // 計算ロジック
        function calculate() {
            // エラー表示をクリア
            hideError();

            const val1 = num1Input.value.trim();
            const val2 = num2Input.value.trim();

            // 未入力チェック
            if (val1 === '' || val2 === '') {
                showError('「数値1」と「数値2」の両方を入力してください。');
                return;
            }

            const num1 = Number(val1);
            const num2 = Number(val2);

            // 数値変換チェック (NaN判定)
            if (isNaN(num1) || isNaN(num2)) {
                showError('有効な数値を入力してください。');
                return;
            }

            // 加算処理（浮動小数点数誤差対策を含む）
            const sum = addPrecise(num1, num2);

            // 結果の表示
            resultValue.textContent = formatNumber(sum);
            expressionDetail.textContent = `${formatNumber(num1)} + ${formatNumber(num2)} = ${formatNumber(sum)}`;

            // 結果領域を表示 (アニメーション再適用のため一旦リセット)
            resultContainer.classList.remove('hidden');
            resultContainer.classList.remove('animate-pop-in');
            void resultContainer.offsetWidth; // リフローを強制
            resultContainer.classList.add('animate-pop-in');
        }

        // 浮動小数点加算の精度調整関数
        function addPrecise(a, b) {
            const aDecimals = (a.toString().split('.')[1] || '').length;
            const bDecimals = (b.toString().split('.')[1] || '').length;
            const factor = Math.pow(10, Math.max(aDecimals, bDecimals));
            return (Math.round(a * factor) + Math.round(b * factor)) / factor;
        }

        // 数値のフォーマット（桁区切り）
        function formatNumber(num) {
            return num.toLocaleString('ja-JP', { maximumFractionDigits: 10 });
        }

        // エラーメッセージの表示
        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            // カード全体をシェイクさせる
            calculatorCard.classList.remove('animate-shake');
            void calculatorCard.offsetWidth; // リフロー
            calculatorCard.classList.add('animate-shake');
        }

        // エラーメッセージの非表示
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // フォームのリセット
        function resetForm() {
            num1Input.value = '';
            num2Input.value = '';
            hideError();
            resultContainer.classList.add('hidden');
            num1Input.focus();
        }

        // 結果のクリップボードコピー処理
        function copyResult() {
            const textToCopy = resultValue.textContent.trim();
            if (!textToCopy) return;

            // クリップボードへコピー
            const tempInput = document.createElement('input');
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            // ボタンのフィードバックUI表示
            const copyText = document.getElementById('copyText');
            const originalText = copyText.textContent;
            copyText.textContent = 'コピー完了!';
            
            setTimeout(() => {
                copyText.textContent = originalText;
            }, 1800);
        }

        // ページ読み込み時に最初のフィールドにフォーカス
        window.onload = function() {
            num1Input.focus();
        };
    </script>
</body>
</html>
